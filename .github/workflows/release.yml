name: release

# Builds prebuilt component binaries for tagged releases so installs don't
# need a Nim/Go toolchain: assets are named <component>-<hostOS>-<hostCPU>,
# exactly what the plugins component looks for.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# futhark (natswrapper's C-header wrapper) needs libclang at link time:
# Xcode CLT provides it on macOS runners.
env:
  LIBRARY_PATH: /Library/Developer/CommandLineTools/usr/lib

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the SDK + nimble deps live in the harness repo; build from its
      # root so niffler's config.nims resolves the package paths
      - uses: actions/checkout@v4
        with:
          repository: gokr/niffler
          path: niffler
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
      - name: Install SDK dependencies
        working-directory: niffler
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          # natswrapper wraps the native nats.c library (futhark): build it
          git clone --depth 1 https://github.com/nats-io/nats.c /tmp/nats.c
          cmake -S /tmp/nats.c -B /tmp/nats.c/build \
            -DNATS_BUILD_WITH_TLS=OFF -DNATS_BUILD_STREAMING=OFF \
            -DNATS_BUILD_EXAMPLES=OFF -DNATS_BUILD_LIB_ONLY=ON
          cmake --build /tmp/nats.c/build -j2
          sudo cmake --install /tmp/nats.c/build
          # only natswrapper — the component never touches bitbarrel/lz4
          nimble install -y https://github.com/gokr/natswrapper
      - name: Build component
        working-directory: niffler
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          nim c --hints:off -d:release --path:sdk \
            -o:"$GITHUB_WORKSPACE/dist/weather-linux-amd64" \
            "$GITHUB_WORKSPACE/weather/main.nim"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
